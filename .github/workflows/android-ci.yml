# GitHub Actions CI/CD Pipeline for Document Scanner App
# Automated Testing Pipeline with Comprehensive Test Coverage

name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Job 1: Build and Unit Tests
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Generate Test Report
      if: always()
      run: ./gradlew jacocoTestReport

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: app/build/test-results/

    - name: Upload Code Coverage
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: app/build/reports/jacoco/

  # Job 2: Android Instrumentation Tests
  instrumentation-tests:
    name: Android Instrumentation Tests
    runs-on: macos-latest

    strategy:
      matrix:
        api-level: [29, 30, 31]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Android Instrumentation Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        script: ./gradlew connectedDebugAndroidTest

    - name: Upload Instrumentation Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: instrumentation-test-results-api-${{ matrix.api-level }}
        path: app/build/reports/androidTests/

  # Job 3: Performance Benchmarks
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Run Performance Benchmarks
      run: ./gradlew :app:test --tests "PerformanceBenchmarkTest"

    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: app/build/test-results/

  # Job 4: Code Quality & Static Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Run Lint
      run: ./gradlew lint

    - name: Upload Lint Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: lint-results
        path: app/build/reports/lint-results.html

  # Job 5: Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run dependency check
      run: ./gradlew dependencyCheckAnalyze
      continue-on-error: true

    - name: Upload Security Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: app/build/reports/

  # Job 6: Build Release APK
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [build-and-test, instrumentation-tests, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk

  # Job 7: Test Summary & Notifications
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, instrumentation-tests, performance-benchmarks]
    if: always()

    steps:
    - name: Download Test Results
      uses: actions/download-artifact@v3
      with:
        name: test-results

    - name: Generate Summary
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests completed" >> $GITHUB_STEP_SUMMARY
        echo "📊 Check artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY

# Environment Variables
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxPermSize=512m"

# Notification on failure
# Configure in repository settings

